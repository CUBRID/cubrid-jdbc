name: github-checks
on: 
  pull_request:
    branches:
      - develop
      - 'feature/**'
jobs:
  license:
    name: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: jitterbit/get-changed-files@v1
        id: files
        continue-on-error: true
      - name: Check license
        run: |
          set +e # make this step proceed even if a command returns non-zero
          license_headers=.github/workflows/license_headers
          result="PASS"
          for f in ${{ steps.files.outputs.added_modified }}; do
            if [ -d "$f" ]; then
              continue
            fi

            ext=$(expr $f : ".*\(\..*\)")
            case $ext in
            .java) true;; # only these formats are checked.
            *) continue ;; # skip others
            esac

            result_for_f="FAIL"
            for header in `find $license_headers -type f`; do
              line_cnt=`wc -l < $header`
              head -n $line_cnt $f | diff -w - $header 2>&1 1>/dev/null
              if [ $? -eq 0 ]; then
                result_for_f="PASS"
                break
              fi
            done

            echo "$f: $result_for_f"
            if [ "$result_for_f" = "FAIL" ]; then
              result="FAIL"
            fi
          done
          test $result = "PASS" # if non-zero, fail
  pr-style:
    name: pr-style
    runs-on: ubuntu-latest
    steps:
      - uses: deepakputhraya/action-pr-title@master
        with:
          regex: '^\[[A-Z]+-\d+\]\s.+'
  code-style:
    name: code-style
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download google-java-format 1.7
        run: |
          wget -q -O "$RUNNER_TEMP/gjf.jar" \
            https://github.com/CUBRID/3rdparty/raw/develop/google-java-format/google-java-format-1.7-all-deps.jar
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: "**/*.java"
          write_output_files: true
      - name: Run google-java-format 1.7 on changed files
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        run: |
            echo "Running google-java-format on changed files..."
            java -jar "$RUNNER_TEMP/gjf.jar" \
              --aosp --replace --set-exit-if-changed @.github/outputs/all_changed_files.txt
      - name: Suggest code changes
        if: ${{ failure() }}
        uses: reviewdog/action-suggester@aa38384ceb608d00f84b4690cacc83a5aba307ff
        with:
          tool_name: code-style (indent, googlejavaformat)
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run gradle test
        run: ./gradlew test --no-daemon
      # Gradle prints nothing when every test passes, so the counts go to the run's Summary page.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          python3 - build/test-results/test >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, itertools, sys, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in sorted(glob.glob(sys.argv[1] + "/TEST-*.xml"))]
          print("### Unit tests\n")
          if not suites:
              print("No test results: the build stopped before the tests ran.")
              sys.exit()
          def total(key):
              return sum(int(s.get(key) or 0) for s in suites)
          tests, failed, skipped = total("tests"), total("failures") + total("errors"), total("skipped")
          seconds = sum(float(s.get("time") or 0) for s in suites)
          print("| Tests | Passed | Failed | Skipped | Time |\n|---:|---:|---:|---:|---:|")
          print(f"| {tests} | {tests - failed - skipped} | {failed} | {skipped} | {seconds:.0f}s |")
          failures = [(c, b) for s in suites for c in s.iter("testcase") for b in c if b.tag in ("failure", "error")]
          if failures:
              print("\n```")
              for case, bad in failures:
                  trace = (bad.text or "").splitlines()
                  cause = list(itertools.takewhile(lambda line: not line.startswith("\tat "), trace))
                  where = [line.strip() for line in trace if line.strip().startswith(f"at {case.get('classname')}.")]
                  print(f"{case.get('classname')} > {case.get('name')}")
                  for line in cause + where[:1]:
                      print("    " + line)
              print("```")
          EOF
  build-parity:
    name: build-parity
    runs-on: ubuntu-latest
    steps:
      # Full history: the serial counts commits, and a shallow clone would give both builds 0001.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      # The engine still builds the driver with Ant while Maven Central gets the Gradle jars, so the
      # two builds must keep producing the same classes and resources. compile-test keeps the Ant test
      # targets compiling, now that the tests themselves run with Gradle.
      - name: Compare the Ant and Gradle jars
        shell: bash
        run: |
          mkdir -p output
          cmake -DCUBRID_JDBC_SOURCE_DIR="$PWD" -DCUBRID_JDBC_OUTPUT_DIR="$PWD/output" -P cmake/gen_version.cmake
          version=$(cat output/VERSION-DIST)
          ant compile-test dist-cubrid
          mkdir -p "$RUNNER_TEMP/ant"
          mv cubrid-jdbc-*.jar "$RUNNER_TEMP/ant/"
          ./gradlew buildJdbc --no-daemon
          entries() {
            unzip -lv "$1" \
              | awk 'length($7) == 8 && $7 ~ /^[0-9a-f]+$/ && $8 !~ /\/$/ && $8 != "META-INF/MANIFEST.MF" { print $7, $8 }' \
              | sort -k2
          }
          for jar in "cubrid-jdbc-$version.jar" "cubrid-jdbc-$version-sources.jar"; do
            count=$(entries "$jar" | wc -l)
            echo "$jar: $count files"
            [ "$count" -gt 0 ]
            diff <(entries "$RUNNER_TEMP/ant/$jar") <(entries "$jar")
          done
