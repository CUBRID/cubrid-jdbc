// Only release.sh loads this, so no other build downloads the plugin.
initscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        // Pinned: 2.0.0 still runs on JDK 8, which the release uses.
        classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
    }
}

rootProject {
    apply plugin: io.github.gradlenexus.publishplugin.NexusPublishPlugin
    nexusPublishing {
        repositories {
            sonatype {
                nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
                snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            }
        }
    }
    // Open the remote staging repository only once everything is built and signed, so a local
    // failure leaves nothing open on the server.
    tasks.matching { it.name == 'initializeSonatypeStagingRepository' }.configureEach {
        mustRunAfter tasks.withType(org.gradle.plugins.signing.Sign)
    }
}
